kind = "web"
previewPath = "/"
title = "Sentinel AI"
description = "An enterprise vehicle-quality intelligence platform that detects emerging risks, explains evidence, and helps engineering teams prioritize action before issues become recalls."
version = "1.0.0"
id = "artifacts/sentinel-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23148

[services.development]
run = "pnpm --filter @workspace/sentinel-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sentinel-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/sentinel-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23148"
BASE_PATH = "/"
